apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique
resources:
  - namespace.yaml
  - upstream.yaml
patches:
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
